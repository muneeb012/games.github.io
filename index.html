const F=s=>`italic 700 ${s}px "Chakra Petch",Impact,sans-serif`;
let best=0;try{best=+localStorage.getItem('mau_best')||0}catch(e){}
const R=(a,b)=>a+Math.random()*(b-a);
const bgStars=Array.from({length:80},()=>({x:R(0,W),y:R(0,G-60),r:R(.5,1.8),p:R(.05,.4),o:R(0,6)}));
let st='title',t=0,speed,dist,coins,py,vy,jumps,obs,pick,parts,nextO,shake,overT=0,off=0,gOff=0,newBest=false;
function reset(){speed=380;dist=0;coins=0;py=0;vy=0;jumps=0;obs=[];pick=[];parts=[];nextO=1.2;shake=0;newBest=false}
reset();
const sc=()=>Math.floor(dist)+coins*10;
function press(){
  if(st==='over'&&overT<.6)return;
  if(st!=='play'){reset();st='play'}
  if(jumps<2){vy=jumps?780:900;jumps++}
}
addEventListener('pointerdown',e=>{e.preventDefault();press()});
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();if(!e.repeat)press()}});
const hit=(a,b,c2,d,e,f,g,h)=>a<e+g&&a+c2>e&&b<f+h&&b+d>f;
function burst(px,py2,col,n){for(let i=0;i<n;i++)parts.push({x:px,y:py2,vx:R(-260,260),vy:R(-320,120),l:R(.3,.7),c:col})}
function die(){st='over';shake=14;overT=0;burst(PX+SW/2,G-py-80,'#ff8a5c',26);
  const s=sc();if(s>best){best=s;newBest=true;try{localStorage.setItem('mau_best',best)}catch(e){}}}
function spawn(){
  if(Math.random()<.7){const n=Math.random()<.3?2:1;for(let i=0;i<n;i++){const w=R(48,90),h=R(44,96);obs.push({k:'r',x:W+40+i*(w+70),w,h})}}
  else obs.push({k:'c',x:W+40,y:G-R(200,250),r:24});
  if(Math.random()<.6){const bx=W+R(100,260),by=R(90,190);for(let i=0;i<5;i++)pick.push({x:bx+i*44,y:G-by-Math.sin(i/4*Math.PI)*70,t:0})}
  nextO=R(.9,1.5)*(420/speed)+.35;
}
function upd(dt){
  t+=dt;
  const sp=st==='play'?speed:(st==='title'?150:0);
  off+=sp*.12*dt;gOff+=sp*dt;
  if(st==='play'){
    speed=Math.min(880,speed+9*dt);dist+=speed*dt/10;
    vy-=2300*dt;py+=vy*dt;if(py<=0){py=0;vy=0;jumps=0}
    nextO-=dt;if(nextO<=0)spawn();
    const hx=PX+50,hy=G-py-150;
    for(const o of obs){
      o.x-=(speed+(o.k==='c'?140:0))*dt;
      const b=o.k==='r'?[o.x+8,G-o.h+10,o.w-16,o.h-10]:[o.x-o.r+6,o.y-o.r+6,o.r*2-12,o.r*2-12];
      if(st==='play'&&hit(hx,hy,SW-100,150,...b))die();
    }
    obs=obs.filter(o=>o.x>-140);
    for(const p of pick){p.x-=speed*dt;if(!p.t&&Math.hypot(p.x-(PX+SW/2),p.y-(G-py-80))<44){p.t=1;coins++;burst(p.x,p.y,'#ffd36b',6)}}
    pick=pick.filter(p=>p.x>-30&&!p.t);
    if(py===0&&Math.random()<.5)parts.push({x:PX+30,y:G-4,vx:R(-160,-60),vy:R(-70,-10),l:.5,c:'#e8c8ff'});
  }else if(st==='over'&&py>0){vy-=2300*dt;py=Math.max(0,py+vy*dt);if(py===0)vy=0}
  parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt});parts=parts.filter(q=>q.l>0);
  shake=Math.max(0,shake-dt*30);overT+=dt;
}
function star(cx,cy,r){x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;x.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}x.closePath();x.fill()}
function txt(s,px,py2,size,fill,stroke){x.font=F(size);x.textAlign='center';
  if(stroke){x.lineWidth=4;x.strokeStyle=stroke;x.lineJoin='round';x.strokeText(s,px,py2)}
  x.fillStyle=fill;x.fillText(s,px,py2)}
function draw(){
  x.save();
  if(shake)x.translate(R(-1,1)*shake,R(-1,1)*shake);
  let g=x.createLinearGradient(0,0,0,G);
  g.addColorStop(0,'#0b0724');g.addColorStop(.55,'#1c1050');g.addColorStop(.85,'#5a2a78');g.addColorStop(1,'#e8875a');
  x.fillStyle=g;x.fillRect(-20,-20,W+40,G+20);
  if(sky.complete&&sky.naturalWidth){
    const h=520,w=sky.naturalWidth*h/sky.naturalHeight,o=-(off%(w*2));
    for(let i=0;i<3;i++){x.save();x.translate(o+i*w+(i%2?w:0),0);if(i%2)x.scale(-1,1);x.drawImage(sky,0,0,w,h);x.restore()}
  }
  g=x.createLinearGradient(0,360,0,G);
  g.addColorStop(0,'rgba(36,20,96,0)');g.addColorStop(.3,'rgba(60,30,110,1)');g.addColorStop(1,'rgba(232,135,90,1)');
  x.fillStyle=g;x.fillRect(-20,360,W+40,G-360);
  for(const s of bgStars){const px=((s.x-off*s.p*8)%W+W)%W;x.globalAlpha=.4+.6*Math.abs(Math.sin(t*1.5+s.o));x.fillStyle='#fff';x.beginPath();x.arc(px,s.y,s.r,0,7);x.fill()}
  x.globalAlpha=1;
  x.fillStyle='#120c2a';x.fillRect(-20,G,W+40,H-G+20);
  x.save();x.shadowBlur=18;x.shadowColor='#ff9d4d';x.strokeStyle='#ffc76b';x.lineWidth=3;x.beginPath();x.moveTo(-20,G);x.lineTo(W+20,G);x.stroke();x.restore();
  x.fillStyle='rgba(255,199,107,.10)';
  for(let i=0;i<14;i++){const px=((i*97-gOff)%(W+100)+W+100)%(W+100)-50;x.fillRect(px,G+28+(i*53)%120,30+(i*37)%40,5)}
  for(const p of pick){x.save();x.shadowBlur=14;x.shadowColor='#ffb84d';x.fillStyle='#ffd36b';star(p.x,p.y,13);x.restore()}
  for(const o of obs){
    if(o.k==='r'){x.save();x.shadowBlur=12;x.shadowColor='#8a5cff';x.fillStyle='#241a4a';x.strokeStyle='#b58cff';x.lineWidth=2.5;x.lineJoin='round';
      x.beginPath();x.moveTo(o.x,G);x.lineTo(o.x+o.w*.1,G-o.h*.55);x.lineTo(o.x+o.w*.35,G-o.h);x.lineTo(o.x+o.w*.7,G-o.h*.8);x.lineTo(o.x+o.w,G-o.h*.3);x.lineTo(o.x+o.w*.95,G);x.closePath();x.fill();x.stroke();x.restore()}
    else{const tg=x.createLinearGradient(o.x,0,o.x+110,0);tg.addColorStop(0,'rgba(255,140,80,.9)');tg.addColorStop(1,'rgba(255,140,80,0)');
      x.fillStyle=tg;x.beginPath();x.moveTo(o.x,o.y-o.r);x.lineTo(o.x+110,o.y);x.lineTo(o.x,o.y+o.r);x.fill();
      const rg=x.createRadialGradient(o.x,o.y,2,o.x,o.y,o.r);rg.addColorStop(0,'#fff6d8');rg.addColorStop(1,'#ff8a5c');
      x.fillStyle=rg;x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.fill()}
  }
  if(spr.complete&&spr.naturalWidth){
    const SH=SW*spr.naturalHeight/spr.naturalWidth,bob=py===0&&st!=='over'?Math.sin(t*20)*1.6:0;
    x.save();x.translate(PX+SW/2,G-py+bob);x.rotate(st==='over'?.22:-vy/3200);x.scale(-1,1);
    x.drawImage(spr,-SW/2,-SH+6,SW,SH);x.restore();
  }
  for(const q of parts){x.globalAlpha=Math.max(0,q.l*1.6);x.fillStyle=q.c;x.fillRect(q.x,q.y,4,4)}
  x.globalAlpha=1;x.restore();
  if(st==='play'){
    txt(String(sc()),W/2,70,44,'#fff','rgba(11,7,36,.8)');
    x.textAlign='left';x.font=F(22);x.fillStyle='#ffd9a0';x.fillText('Best '+best,24,40);
    x.textAlign='right';x.fillText('★ '+coins,W-24,40);
  }else{
    x.fillStyle='rgba(11,7,36,.45)';x.fillRect(0,0,W,H);
    const pulse=.55+.45*Math.abs(Math.sin(t*3));
    if(st==='title'){
      txt('MUNEEB AGAINST',W/2,210,48,'#fff','#ff9d1f');txt('THE UNIVERSE',W/2,268,48,'#fff','#ff9d1f');
      txt('A Cursed Story',W/2,318,28,'#ffd9a0');
      x.globalAlpha=pulse;txt('Tap or press Space to ride',W/2,640,26,'#fff');x.globalAlpha=1;
      txt('Tap again in the air to double jump',W/2,678,20,'#ffd9a0');
    }else{
      txt('Wiped out',W/2,330,56,'#fff','#ff9d1f');
      txt('Score '+sc(),W/2,400,38,'#fff');
      txt(newBest?'New best!':'Best '+best,W/2,446,28,'#ffd36b');
      x.globalAlpha=overT>.6?pulse:.2;txt('Tap to ride again',W/2,560,26,'#fff');x.globalAlpha=1;
    }
  }
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;upd(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
