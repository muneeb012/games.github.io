const F=s=>`italic 700 ${s}px "Chakra Petch",Impact,sans-serif`;
const R=(a,b)=>a+Math.random()*(b-a),yOf=l=>LY[0]+(LY[2]-LY[0])*l/2,scl=y=>.72+(y-LY[0])/(LY[2]-LY[0])*.28;
let best=0;try{best=+localStorage.getItem('sc_best')||0}catch(e){}
const bl=mh=>{const a=[];let p=0;while(p<1500){const w=R(50,110);a.push({x:p,w,h:R(mh*.5,mh),s:Math.random()});p+=w+R(0,14)}return a};
const B1=bl(300),B2=bl(380);
let st='title',t=0,speed,dist,coins,lane,ly,py,vy,obs,pick,parts,nextO,gap,inv,shake,pgy,off=0,overT=0,newBest=false,base=330;
function reset(){speed=base;dist=0;coins=0;lane=1;ly=1;py=0;vy=0;obs=[];pick=[];parts=[];nextO=1.4;gap=1;inv=0;shake=0;pgy=1;newBest=false}
reset();
const sc=()=>Math.floor(dist)+coins*10;
function go(){if(st==='over'&&overT<.6)return;if(st!=='play'){reset();st='play'}}
function jump(){go();if(st==='play'&&py===0)vy=820}
function move(d){go();if(st==='play')lane=Math.max(0,Math.min(2,lane+d))}
let pd=null;
addEventListener('pointerdown',e=>{e.preventDefault();pd={x:e.clientX,y:e.clientY,f:false}});
addEventListener('pointermove',e=>{if(!pd||pd.f)return;const dx=e.clientX-pd.x,dy=e.clientY-pd.y;if(Math.abs(dy)>30&&Math.abs(dy)>Math.abs(dx)){pd.f=true;move(dy<0?-1:1)}});
addEventListener('pointerup',()=>{if(pd&&!pd.f)jump();pd=null});
addEventListener('keydown',e=>{if(e.repeat)return;const k=e.code;
  if(k==='Space'){e.preventDefault();jump()}else if(k==='ArrowUp'||k==='KeyW'){e.preventDefault();move(-1)}else if(k==='ArrowDown'||k==='KeyS'){e.preventDefault();move(1)}});
function burst(px,py2,col,n){for(let i=0;i<n;i++)parts.push({x:px,y:py2,vx:R(-240,240),vy:R(-300,100),l:R(.3,.7),c:col})}
function die(){st='over';shake=14;overT=0;burst(PX+SW/2,yOf(ly)-60,'#ffd36b',22);
  const s=sc();if(s>best){best=s;newBest=true;try{localStorage.setItem('sc_best',best)}catch(e){}}}
function spawn(){
  const l=Math.floor(R(0,3)),r=Math.random();
  const mk=(k,ln)=>k==='t'?{k,l:ln,x:W+60,w:240,h:130,j:0,col:['#3f7fd8','#d8583f','#3fae6b'][Math.floor(R(0,3))]}:k==='b'?{k,l:ln,x:W+60,w:80,h:48,j:1}:{k,l:ln,x:W+60,w:56,h:46,j:1};
  if(r<.22){const l2=(l+1+Math.floor(R(0,2)))%3;obs.push(mk('t',l),mk('t',l2))}
  else obs.push(mk(r<.6?'t':r<.85?'b':'c',l));
  if(Math.random()<.7){const cl=Math.floor(R(0,3)),bx=W+R(80,300);for(let i=0;i<5;i++)pick.push({x:bx+i*46,l:cl,t:0})}
  nextO=R(1.05,1.7)*(400/speed)+.25;
}
function upd(dt){
  t+=dt;
  const sp=st==='play'?speed:(st==='title'?160:0);off+=sp*dt;
  ly+=(lane-ly)*Math.min(1,dt*12);
  if(st==='play'){
    speed=Math.min(760,speed+7*dt);dist+=speed*dt/10;
    vy-=2200*dt;py=Math.max(0,py+vy*dt);if(py===0&&vy<0)vy=0;
    inv=Math.max(0,inv-dt);if(!inv)gap=Math.min(1,gap+dt*.06);
    nextO-=dt;if(nextO<=0)spawn();
    const hx=PX+50,hw=SW-110;
    for(const o of obs){o.x-=speed*dt;const s=scl(yOf(o.l));
      if(!inv&&Math.abs(o.l-ly)<.5&&hx<o.x+o.w*s&&hx+hw>o.x&&!(o.j&&py>o.h*.95)){
        gap-=.5;inv=1.4;shake=10;speed=Math.max(base,speed*.72);burst(PX+SW/2,yOf(ly)-50,'#ff8a5c',12);if(gap<=0)die()}}
    obs=obs.filter(o=>o.x>-300);
    for(const p of pick){p.x-=speed*dt;if(!p.t&&Math.abs(p.l-ly)<.5&&p.x>PX+30&&p.x<PX+SW-30&&py<80){p.t=1;coins++;burst(p.x,yOf(p.l)-40,'#ffd36b',5)}}
    pick=pick.filter(p=>p.x>-30&&!p.t);
  }
  pgy+=(ly-pgy)*Math.min(1,dt*3);
  parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt});parts=parts.filter(q=>q.l>0);
  shake=Math.max(0,shake-dt*30);overT+=dt;
}

  x.font=F(15);x.textAlign='center';x.fillStyle='#fff';x.fillText('POLICE',116,-19);
  wheel(48,-14,20);wheel(184,-14,20);x.restore();
  const a=Math.max(0,.6-gap)/.6*.22;
  if(a>0&&st!=='title'){const g=x.createLinearGradient(0,0,W*.5,0);g.addColorStop(0,(fl?'rgba(255,59,59,':'rgba(74,141,255,')+a+')');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,W,H)}
}
function drawPlayer(){
  if(!spr.complete||!spr.naturalWidth)return;
  const gy=yOf(ly),s=scl(gy),w=SW*s,h=w*spr.naturalHeight/spr.naturalWidth,bob=py===0&&st==='play'?Math.sin(t*22)*1.5:0;
  shadow(PX+w/2,gy,w*.9,1-Math.min(.5,py/300));
  x.save();if(inv>0&&st==='play')x.globalAlpha=Math.floor(t*14)%2?.45:1;
  x.translate(PX+w/2,gy-py+bob);x.rotate((lane-ly)*.1-vy/6000);x.drawImage(spr,-w/2,-h+4*s,w,h);x.restore();
}
function city(a,k,col){for(const b of a){const px=((b.x-off*k)%1500+1500)%1500-100;x.fillStyle=col;x.fillRect(px,520-b.h,b.w,b.h);x.fillStyle='rgba(255,208,120,.5)';
  for(let iy=0;iy*20+12<b.h-14;iy++)for(let ix=0;ix*16+8<b.w-12;ix++)if((ix*3+iy*5+((b.s*10)|0))%4===0)x.fillRect(px+8+ix*16,520-b.h+12+iy*20,7,9)}}
function txt(s,px,py2,size,fill,stroke){x.font=F(size);x.textAlign='center';if(stroke){x.lineWidth=4;x.strokeStyle=stroke;x.lineJoin='round';x.strokeText(s,px,py2)}x.fillStyle=fill;x.fillText(s,px,py2)}
function draw(){
  x.save();if(shake)x.translate(R(-1,1)*shake,R(-1,1)*shake);
  let g=x.createLinearGradient(0,0,0,520);g.addColorStop(0,'#2b1055');g.addColorStop(.6,'#7b2d8e');g.addColorStop(1,'#ff9a5a');
  x.fillStyle=g;x.fillRect(-20,-20,W+40,560);
  x.fillStyle='rgba(255,208,138,.9)';x.beginPath();x.arc(W*.72,430,54,0,7);x.fill();
  city(B1,.1,'#4a2477');city(B2,.22,'#2a1250');
  x.fillStyle='#4a3b6b';x.fillRect(-20,516,W+40,34);
  for(let i=0;i<6;i++){const px=((i*260-off*.9)%1560+1560)%1560-100;x.fillStyle='#2a1f45';x.fillRect(px,470,6,50);x.fillStyle='#ffd58a';x.beginPath();x.arc(px+3,466,9,0,7);x.fill()}
  x.fillStyle='#2b2840';x.fillRect(-20,548,W+40,H-548);
  x.fillStyle='#1c1a2e';x.fillRect(-20,H-26,W+40,30);
  x.fillStyle='rgba(233,220,192,.7)';
  for(const yy of [(LY[0]+LY[1])/2+14,(LY[1]+LY[2])/2+14])for(let i=-1;i<12;i++){const px=((i*110-off)%1210+1210)%1210-110;x.fillRect(px,yy-2,60,5)}
  const items=[...obs.map(o=>({y:yOf(o.l),f:()=>drawObs(o)})),{y:yOf(ly)+.5,f:drawPlayer},{y:yOf(pgy)+.4,f:drawPolice}];
  for(const p of pick)items.push({y:yOf(p.l)-1,f:()=>{const gy=yOf(p.l),s=scl(gy);x.save();x.shadowBlur=12;x.shadowColor='#ffb84d';x.fillStyle='#ffd36b';x.beginPath();x.arc(p.x,gy-42*s,11*s,0,7);x.fill();x.fillStyle='#e8a93a';x.beginPath();x.arc(p.x,gy-42*s,6*s,0,7);x.fill();x.restore()}});
  items.sort((a,b)=>a.y-b.y).forEach(i=>i.f());
  for(const q of parts){x.globalAlpha=Math.max(0,q.l*1.6);x.fillStyle=q.c;x.fillRect(q.x,q.y,4,4)}
  x.globalAlpha=1;x.restore();
  if(st==='play'){
    txt(String(sc()),W/2,70,44,'#fff','rgba(26,13,51,.8)');
    x.textAlign='left';x.font=F(20);x.fillStyle='#ffd9a0';x.fillText('Police distance',24,38);
    x.fillStyle='rgba(255,255,255,.2)';x.fillRect(24,48,130,12);x.fillStyle=gap>.6?'#6be08a':gap>.3?'#ffd36b':'#ff5c5c';x.fillRect(24,48,130*gap,12);
    x.textAlign='right';x.font=F(22);x.fillStyle='#ffd9a0';x.fillText('Coins '+coins,W-24,38);
  }else{
    x.fillStyle='rgba(26,13,51,.5)';x.fillRect(0,0,W,H);
    const pulse=.55+.45*Math.abs(Math.sin(t*3));
    if(st==='title'){
      txt('STREET CHASE',W/2,215,64,'#fff','#ff9d1f');txt("Don't let the police catch you",W/2,265,24,'#ffd9a0');
      x.globalAlpha=pulse;txt('Tap to start',W/2,420,30,'#fff');x.globalAlpha=1;
      txt('Swipe up or down to change lane',W/2,462,20,'#ffd9a0');txt('Tap to jump over barriers and cones',W/2,490,20,'#ffd9a0');
    }else{
      txt('Caught!',W/2,300,64,'#fff','#ff9d1f');txt('Score '+sc(),W/2,372,38,'#fff');
      txt(newBest?'New best!':'Best '+best,W/2,418,28,'#ffd36b');
      x.globalAlpha=overT>.6?pulse:.2;txt('Tap to ride again',W/2,500,26,'#fff');x.globalAlpha=1;
    }
  }
}
let last=0;
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;upd(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
